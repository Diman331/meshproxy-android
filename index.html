<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MeshProxy P2P Network</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; }
        .card { background: #1e293b; padding: 20px; border-radius: 12px; max-width: 400px; margin: 0 auto; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3); }
        h1 { font-size: 20px; text-align: center; color: #38bdf8; }
        .mode-group { margin: 20px 0; }
        .mode-option { display: flex; align-items: center; background: #334155; padding: 12px; border-radius: 8px; margin-bottom: 8px; cursor: pointer; }
        .mode-option input { margin-right: 12px; }
        .btn { display: block; width: 100%; padding: 14px; background: #0284c7; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; text-align: center; }
        .btn.active { background: #ef4444; }
        .status { margin-top: 20px; text-align: center; font-weight: 500; color: #94a3b8; }
        .stats { margin-top: 8px; text-align: center; font-size: 13px; color: #64748b; }
    </style>
</head>
<body>
    <div class="card">
        <h1>MeshProxy P2P Network</h1>
        
        <div class="mode-group">
            <label class="mode-option">
                <input type="radio" name="mode" value="client" checked>
                <div>
                    <strong>Клиент</strong>
                    <div style="font-size: 12px; color: #94a3b8;">Потреблять трафик через P2P</div>
                </div>
            </label>
            <label class="mode-option">
                <input type="radio" name="mode" value="source">
                <div>
                    <strong>Источник</strong>
                    <div style="font-size: 12px; color: #94a3b8;">Раздавать трафик в сеть</div>
                </div>
            </label>
            <label class="mode-option">
                <input type="radio" name="mode" value="auto">
                <div>
                    <strong>Автоматический</strong>
                    <div style="font-size: 12px; color: #94a3b8;">Клиент + Источник</div>
                </div>
            </label>
        </div>

        <button id="toggleBtn" class="btn" onclick="toggleNetwork()">Запустить сеть</button>

        <div id="statusText" class="status">Статус: Остановлено</div>
        <div id="statsText" class="stats">Передано: 0 КБ | Источников: 0</div>
    </div>

    <script>
        let isRunning = false;
        function toggleNetwork() {
            const btn = document.getElementById('toggleBtn');
            const status = document.getElementById('statusText');
            const stats = document.getElementById('statsText');
            const selectedMode = document.querySelector('input[name="mode"]:checked').parentNode.querySelector('strong').innerText;

            isRunning = !isRunning;
            if (isRunning) {
                btn.innerText = "Остановить сеть";
                btn.classList.add("active");
                status.innerText = "Статус: Работает (" + selectedMode + ")";
                status.style.color = "#4ade80";
                stats.innerText = "Передано: 12.4 КБ | Источников: 3";
            } else {
                btn.innerText = "Запустить сеть";
                btn.classList.remove("active");
                status.innerText = "Статус: Остановлено";
                status.style.color = "#94a3b8";
                stats.innerText = "Передано: 0 КБ | Источников: 0";
            }
        }
    </script>
</body>
</html>
